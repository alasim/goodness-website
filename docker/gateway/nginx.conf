# GOODNESS OS — local API gateway.
#
# Presents one origin (http://localhost:54321) with the paths supabase-js expects. The services
# behind it do their own JWT verification and set their own CORS headers, so this file must not
# add a second Access-Control-Allow-Origin — a duplicated header is rejected by browsers.

map $request_method $preflight {
    default 0;
    OPTIONS 1;
}

server {
    listen 8000;
    server_name _;
    client_max_body_size 50m;

    # Preflight is answered here so a browser never waits on an upstream for it.
    location / {
        if ($preflight) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Allow-Methods 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'authorization, apikey, content-type, x-client-info, prefer, range, accept-profile, content-profile, x-supabase-api-version' always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        return 404 '{"message":"Not found. Use /rest/v1/, /auth/v1/ or /health."}';
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","stack":"goodness-os-local"}';
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PostgREST reads the role from the JWT in this header; supabase-js always sends it.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Profile $http_accept_profile;
        proxy_set_header Content-Profile $http_content_profile;
    }

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
